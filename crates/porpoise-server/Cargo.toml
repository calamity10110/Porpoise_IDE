[package]
name = "porpoise-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background daemon — orchestrates all Porpoise services"

[[bin]]
name = "porpoise-server"
path = "src/main.rs"

[dependencies]
porpoise-core = { path = "../porpoise-core" }
porpoise-db = { path = "../porpoise-db" }
porpoise-relay = { path = "../porpoise-relay" }
porpoise-runtime = { path = "../porpoise-runtime" }
porpoise-git = { path = "../porpoise-git" }
porpoise-agent = { path = "../porpoise-agent" }
porpoise-terminal = { path = "../porpoise-terminal" }
porpoise-network = { path = "../porpoise-network" }
porpoise-ssh = { path = "../porpoise-ssh" }
porpoise-browser = { path = "../porpoise-browser" }
porpoise-skills = { path = "../porpoise-skills" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
libc.workspace = true
rusqlite.workspace = true
uuid.workspace = true
notify-rust = "4"

[dev-dependencies]
tempfile.workspace = true
