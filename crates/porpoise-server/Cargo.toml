[package]
name = "porpoise-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background daemon — orchestrates all Porpoise services"

[[bin]]
name = "porpoise-server"
path = "src/main.rs"

[dependencies]
porpoise-core = { path = "../porpoise-core" }
porpoise-db = { path = "../porpoise-db" }
porpoise-relay = { path = "../porpoise-relay" }
porpoise-runtime = { path = "../porpoise-runtime" }
porpoise-git = { path = "../porpoise-git", optional = true }
porpoise-terminal = { path = "../porpoise-terminal", optional = true }
porpoise-agent = { path = "../porpoise-agent", optional = true }
porpoise-ssh = { path = "../porpoise-ssh", optional = true }
porpoise-browser = { path = "../porpoise-browser", optional = true }
porpoise-skills = { path = "../porpoise-skills", optional = true }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
