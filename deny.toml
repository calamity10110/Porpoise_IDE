# Syntax reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
version = 2
unused-allowed-license = "warn"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
yanked = "warn"
ignore = [
    # bincode 1.x is unmaintained; used by porpoise-relay IPC framing.
    # TODO: migrate to postcard or bincode 2.x, then drop this ignore.
    "RUSTSEC-2025-0141",
    # unmaintained transitives pinned by tauri/tauri plugins; no patched versions exist
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0384", # instant (via notify v7, no safe upgrade)
    "RUSTSEC-2025-0134", # rustls-pemfile
    # zstd streaming-decompression advisories via wasmtime-internal-cache,
    # which pins zstd 0.13 (< 0.14.3). zstd-sys was already upgraded to
    # 2.1.2 (clears RUSTSEC-2026-0410). The remaining three need zstd 0.14,
    # blocked on an upstream wasmtime release that bumps its requirement.
    # TODO: drop these ignores when wasmtime moves to zstd >= 0.14.3.
    # Exposure note: these affect streaming decompression of crafted
    # frames; the only zstd consumer here is the wasm module cache, not
    # general untrusted input.
    "RUSTSEC-2026-0391", # zstd: abandoned-stream data leak on reused context
    "RUSTSEC-2026-0398", # zstd: legacy-frame streaming decompression reads uninit memory
    "RUSTSEC-2026-0403", # zstd-safe: Seekable::decompress writes past end
    "RUSTSEC-2017-0008", # serial
    # unsafe-libyaml unmaintained; transitive via deprecated serde_yaml in
    # porpoise-automation/porpoise-terminal. TODO: migrate workflows/terminal
    # config parsing to a maintained YAML crate, then drop this ignore.
    "RUSTSEC-2024-0449",
    # zip extraction flaws; fix requires zip >= 9, but tauri-plugin-updater
    # (latest compatible 2.12.0) still pins zip 4.x. The updater only
    # extracts signature-verified bundles from the project release server.
    # TODO: drop when tauri-plugin-updater moves to zip >= 9.
    "RUSTSEC-2026-0367", # zip SUID/SGID preservation on extract
    "RUSTSEC-2026-0368", # zip symlink escape on extract
    "RUSTSEC-2026-0369", # zip permissions applied through symlinks
    # zvariant / zbus_names / zvariant_derive unmaintained — merged into zbus
    # starting with zbus 6.0.0; Cargo.lock pins zbus 5.16. TODO: migrate to
    # zbus 6, then drop these ignores.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
