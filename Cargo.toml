[workspace]
resolver = "3"
members = [
    "crates/porpoise-core",
    "crates/porpoise-db",
    "crates/porpoise-cli",
    "crates/porpoise-relay",
    "crates/porpoise-runtime",
    "crates/porpoise-server",
    "crates/porpoise-git",
    "crates/porpoise-terminal",
    "crates/porpoise-agent",
    "crates/porpoise-ssh",
    "crates/porpoise-browser",
    "crates/porpoise-network",
    "crates/porpoise-skills",
    "crates/porpoise-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Porpoise Contributors"]
description = "Rust-native AI orchestration IDE — port of Orca"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
config = "0.15"
bitflags = "2"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
git2 = "0.20"
octocrab = "0.40"
notify = "7"
nix = { version = "0.29", features = ["fs", "term", "signal", "process", "uio", "ioctl"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
wasmtime = "25"
owo-colors = "4"
async-trait = "0.1"
tempfile = "3"
mockall = "0.13"
proptest = "1"
assert_cmd = "2"
criterion = { version = "0.5", features = ["async_futures"] }
plist = "1"
portable-pty = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
