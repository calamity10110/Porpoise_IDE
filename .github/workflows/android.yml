name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create Android platform scaffold
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name porpoise_mobile .
          # Fix generated test file (uses MyApp instead of PorpoiseApp)
          if [ -f test/widget_test.dart ]; then
            sed -i 's/MyApp/PorpoiseApp/g' test/widget_test.dart || true
          fi
          # Add INTERNET permission (already default) + cleartext ban
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|\
          <uses-permission android:name="android.permission.INTERNET"/>\
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' \
              android/app/src/main/AndroidManifest.xml || true
          fi
          # Set minSdkVersion (handle both .kts and .gradle)
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's|minSdkVersion [0-9]*|minSdkVersion 21|' android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            sed -i 's|minSdkVersion [0-9]*|minSdkVersion 21|' android/app/build.gradle || true
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: porpoise-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
