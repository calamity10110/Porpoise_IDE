name: Probe Ubuntu 26 packages

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: grep VERSION_ID /etc/os-release
      - run: sudo apt-get update
      - name: Probe gdk-pixbuf naming on both distros
        run: |
          for p in libgdk-pixbuf2.0-dev libgdk-pixbuf-2.0-dev; do
            cand=$(apt-cache policy "$p" 2>/dev/null | sed -n 's/  Candidate: //p')
            echo "$p => ${cand:-NONE}"
          done
      - name: Trial install the dashed-name set
        run: >
          sudo apt-get install -y --no-install-recommends
          libglib2.0-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libcairo2-dev
          libpango1.0-dev libatk1.0-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libxdo-dev
