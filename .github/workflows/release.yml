name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (MSI/NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          PORPOISE_WS_PORT: ${{ vars.PORPOISE_WS_PORT || '' }}
        run: cargo tauri build --verbose
        working-directory: crates/porpoise-app

      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | ForEach-Object { $_.Matches.Groups[1].Value }
          if (-not $version) { $version = "0.1.0" }

          $nsisDir = "crates/porpoise-app/target/release/bundle/nsis"
          $matchingNsis = Get-ChildItem -Path $nsisDir -Filter "*.exe" | Select-Object -First 1
          $nsisName = $matchingNsis.Name
          $nsisBase = [System.IO.Path]::GetFileNameWithoutExtension($nsisName)

          # Find the signature and updater bundle (generated by createUpdaterArtifacts)
          $sigFile = Join-Path $nsisDir "$nsisBase.sig"
          $updateZip = Join-Path $nsisDir "$nsisBase.zip"
          if (Test-Path $sigFile) {
            $signature = Get-Content $sigFile -Raw
          } else {
            Write-Warning "No .sig file found at $sigFile"
            $signature = ""
          }

          $manifest = @{
            version = $version
            notes = "See https://github.com/porpoise-ide/porpoise/releases/tag/v$version for release notes"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = if ($signature) { $signature } else { "" }
                url = "https://github.com/porpoise-ide/porpoise/releases/download/v$version/$nsisName"
              }
            }
          }
          $manifestPath = "crates/porpoise-app/target/release/bundle/nsis/update-info.json"
          $manifest | ConvertTo-Json | Set-Content $manifestPath -Encoding UTF8
          Write-Host "Update manifest written to $manifestPath"

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: porpoise-windows-msi
          path: crates/porpoise-app/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: porpoise-windows-nsis
          path: crates/porpoise-app/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: porpoise-windows-updater
          path: |
            crates/porpoise-app/target/release/bundle/nsis/*.zip
            crates/porpoise-app/target/release/bundle/nsis/*.sig
            crates/porpoise-app/target/release/bundle/nsis/update-info.json

  cli:
    name: CLI binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-x86_64
          - os: windows-latest
            suffix: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI binary
        if: runner.os != 'linux'
        run: cargo build --release -p porpoise-cli

      - name: Build CLI binary (Linux with webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          cargo build --release -p porpoise-cli

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: porpoise-cli-${{ matrix.suffix }}
          path: target/release/porpoise-cli*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [windows, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Porpoise ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
