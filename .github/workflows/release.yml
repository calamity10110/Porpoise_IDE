name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p porpoise-cli -p porpoise-server -p porpoise-app

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="porpoise-${TAG}-${{ matrix.target }}"
          mkdir -p "${STAGE}"
          cp target/${{ matrix.target }}/release/porpoise "${STAGE}/"
          cp target/${{ matrix.target }}/release/porpoise-server "${STAGE}/"
          cp target/${{ matrix.target }}/release/porpoise-app "${STAGE}/"
          tar -czf "porpoise-${TAG}-${{ matrix.target }}.tar.gz" "${STAGE}"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "porpoise-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/porpoise.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/porpoise-server.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/porpoise-app.exe" $stage
          Compress-Archive -Path $stage -DestinationPath "porpoise-$tag-${{ matrix.target }}.zip"

      - name: Attach release asset
        uses: softprops/action-gh-release@v2
        with:
          name: Porpoise ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: porpoise-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create Android platform scaffold
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name porpoise_mobile .
          if [ -f test/widget_test.dart ]; then
            sed -i 's/MyApp/PorpoiseApp/g' test/widget_test.dart || true
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|\
          <uses-permission android:name="android.permission.INTERNET"/>\
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' \
              android/app/src/main/AndroidManifest.xml || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's|minSdkVersion [0-9]*|minSdkVersion 21|' android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            sed -i 's|minSdkVersion [0-9]*|minSdkVersion 21|' android/app/build.gradle || true
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Attach release asset
        uses: softprops/action-gh-release@v2
        with:
          name: Porpoise ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
